}

}
@media (prefers-color-scheme: light){ :root:not([data-theme]) { } }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--on);font-family:'Balsamiq Sans',sans-serif;transition:background .4s var(--ease),color .4s var(--ease);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:3px}

.app{max-width:520px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;display:flex;flex-direction:column}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 16px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.5px}
.brand em{font-style:normal;color:var(--primary)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface-high);color:var(--on);display:grid;place-items:center;font-size:18px;transition:transform .4s var(--spring),background .3s}
.icon-btn:hover{background:var(--primary-container);color:var(--on-primary-container)}
.dropdown{position:relative}
.dropdown-trigger{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:100px;background:var(--surface-high);color:var(--on);font-size:13px;font-weight:600}
.dropdown-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface-high);border:1px solid var(--outline);border-radius:16px;padding:6px;display:none;flex-direction:column;gap:2px;box-shadow:var(--elev-3);z-index:50;min-width:140px}
.dropdown-menu.open{display:flex}
.dropdown-option{padding:8px 12px;border-radius:8px;text-align:left;font-size:13px;font-weight:600;color:var(--on)}
.dropdown-option:hover{background:var(--secondary-container);color:var(--on-secondary-container)}
.dropdown-option.selected{background:var(--primary-container);color:var(--on-primary-container)}

.progress-wrap{margin:4px 0 16px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.progress-track{height:6px;border-radius:6px;background:var(--surface-high);overflow:hidden}
.progress-fill{height:100%;border-radius:6px;background:var(--primary);transition:width .4s var(--ease)}

.screen{display:none;flex-direction:column;gap:16px;animation:fade-in .35s var(--ease-dec)}
.screen.active{display:flex}
@keyframes fade-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r-xl);padding:24px 20px;box-shadow:var(--elev-2);transition:background .4s,color .4s,border-color .4s}
.q-title{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:0 0 6px}
.q-hint{font-size:13px;color:var(--muted);margin:0 0 18px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.input,.textarea{width:100%;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--outline);background:var(--surface-high);color:var(--on);font-size:15px;transition:border-color .2s,background .3s}
.input:focus,.textarea:focus{border-color:var(--primary);outline:none}
.textarea{min-height:100px;resize:vertical;font-family:inherit}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:100px;border:1px solid var(--outline);background:var(--surface-high);color:var(--on);font-size:14px;font-weight:600;transition:all .25s var(--spring)}
.chip:hover{background:var(--secondary-container);color:var(--on-secondary-container)}
.chip.selected{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

.color-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .3s var(--spring),border-color .2s;box-shadow:var(--elev-1)}
.swatch:hover{transform:scale(1.1)}
.swatch.selected{border-color:var(--on)}
.color-picker{width:44px;height:44px;border-radius:50%;border:2px solid var(--outline);padding:2px;cursor:pointer;background:var(--surface-high)}

.btn-row{display:flex;gap:10px;justify-content:space-between;margin-top:8px}
.btn{padding:12px 20px;border-radius:100px;font-size:14px;font-weight:700;transition:transform .25s var(--spring),background .3s,color .3s;flex:1}
.btn:active{transform:scale(.96)}
.btn-filled{background:var(--primary);color:var(--on-primary)}
.btn-filled:hover{filter:brightness(1.08)}
.btn-tonal{background:var(--primary-container);color:var(--on-primary-container)}
.btn-outlined{background:transparent;border:1px solid var(--outline);color:var(--on)}
.btn-text{background:transparent;color:var(--primary);flex:0;padding:12px 14px}

.snackbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);background:var(--on);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--elev-3);transition:transform .35s var(--spring);z-index:100;max-width:90vw}
.snackbar.show{transform:translateX(-50%) translateY(0)}

.final{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:200;text-align:center;padding:24px}
.final.show{display:flex}
.final-text{font-size:clamp(28px,7vw,46px);font-weight:700;letter-spacing:-.5px;color:var(--primary);animation:pop .7s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.final-sub{font-size:15px;color:var(--muted)}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:199}
.heart{position:absolute;font-size:24px;animation:fall 3s linear forwards;opacity:.9}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

.welcome-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.welcome-title{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:0 0 8px}
.welcome-sub{font-size:15px;color:var(--muted);margin:0 0 20px;line-height:1.5}

function translate() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => {
    const k = el.dataset.i;
    if (translations[lang][k]) el.textContent = translations[lang][k];
  });
  const dv = document.querySelector('.dv');
  if (dv) dv.textContent = lang.toUpperCase();
  document.querySelectorAll('[data-dropdown="lang"] .dropdown-option').forEach(o => o.classList.toggle('selected', o.dataset.value === lang));
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function renderQuestion() {
  const q = QUESTIONS[step];
  document.getElementById('q-title').textContent = t(Q_TITLE[q.id]);
  const hint = document.getElementById('q-hint');
  hint.textContent = (q.id === 'color') ? t('qColorHint') : '';
  hint.style.display = hint.textContent ? 'block' : 'none';
  const body = document.getElementById('q-body');
  body.innerHTML = '';
  if (q.type === 'color') {
    const row = document.createElement('div');
    row.className = 'color-row';
    SWATCHES.forEach(c => {
      const s = document.createElement('button');
      s.className = 'swatch' + (answers.color === c ? ' selected' : '');
      s.style.background = c;
      s.addEventListener('click', () => { setHueFromHex(c); answers.color = c; renderQuestion(); });
      row.appendChild(s);
    });
    const picker = document.createElement('input');
    picker.type = 'color';
    picker.className = 'color-picker';
    picker.value = answers.color || '#ff6b9d';
    picker.addEventListener('input', e => { setHueFromHex(e.target.value); answers.color = e.target.value; });
    row.appendChild(picker);
    body.appendChild(row);
  } else if (q.type === 'chips') {
    const wrap = document.createElement('div');
    wrap.className = 'chips';
    q.opts.forEach(ok => {
      const b = document.createElement('button');
      b.className = 'chip' + (answers[q.id] === ok ? ' selected' : '');
      b.textContent = t(ok);
      b.addEventListener('click', () => { answers[q.id] = ok; renderQuestion(); });
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
  } else if (q.type === 'textarea') {
    const ta = document.createElement('textarea');
    ta.className = 'textarea';
    ta.placeholder = t(q.phKey);
    ta.value = answers[q.id] || '';
    ta.addEventListener('input', e => { answers[q.id] = e.target.value; });
    body.appendChild(ta);
  } else {
    const inp = document.createElement('input');
    inp.className = 'input';
    inp.type = 'text';
    inp.placeholder = t(q.phKey);
    inp.value = answers[q.id] || '';
    inp.addEventListener('input', e => { answers[q.id] = e.target.value; });
    body.appendChild(inp);
  }

  const back = document.getElementById('back-btn');
  const next = document.getElementById('next-btn');
  back.style.visibility = step === 0 ? 'hidden' : 'visible';
  if (step === QUESTIONS.length - 1) {
    next.textContent = t('submitBtn');
  } else {
    next.textContent = t('nextBtn');
  }

  const wrap = document.getElementById('progress-wrap');
  wrap.style.display = 'block';
  const total = QUESTIONS.length;
  const pct = Math.round((step / total) * 100);
  document.getElementById('progress-text').textContent = t('progressText') + ' ' + (step + 1) + ' / ' + total;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function setHueFromHex(hex) {
  const { h } = hexToHsl(hex);
  hue = h;
  store('hue', hue);
  applyTheme();
}

function hexToHsl(hex) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const r = parseInt(c.slice(0, 2), 16) / 255;
  const g = parseInt(c.slice(2, 4), 16) / 255;
  const b = parseInt(c.slice(4, 6), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0, l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h *= 60;
  }
  return { h: Math.round(h), s, l };
}

function showSnackbar(msg) {
  const el = document.getElementById('snackbar');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function spawnHearts() {
  const container = document.getElementById('hearts');
  for (let i = 0; i < 24; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = Math.random() > 0.5 ? '❤️' : '♡';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDelay = (Math.random() * 1.5) + 's';
    container.appendChild(h);
    setTimeout(() => h.remove(), 4000);
  }
}

async function submit() {
  const payload = { answers, hue, lang, ts: Date.now() };
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('fail');
    document.getElementById('final').classList.add('show');
    spawnHearts();
    setInterval(spawnHearts, 3000);
  } catch (e) {
    showSnackbar(t('snackbarErr'));
  }
}

document.getElementById('start-btn').addEventListener('click', () => {
  step = 0;
  renderQuestion();
  showScreen('screen-q');
});

document.getElementById('back-btn').addEventListener('click', () => {
  if (step > 0) { step--; renderQuestion(); }
});

document.getElementById('next-btn').addEventListener('click', () => {
  const q = QUESTIONS[step];
  if (q.id === 'color' && !answers.color) { showSnackbar(t('qColorHint')); return; }
  if (step < QUESTIONS.length - 1) {
    step++;
    renderQuestion();
  } else {
    submit();
  }
});

document.getElementById('close-final').addEventListener('click', () => {
  document.getElementById('final').classList.remove('show');
  document.getElementById('hearts').innerHTML = '';
  step = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  showScreen('screen-welcome');
  document.getElementById('progress-wrap').style.display = 'none';
});

const langDropdown = document.querySelector('[data-dropdown="lang"]');
langDropdown.addEventListener('click', e => {
  const opt = e.target.closest('.dropdown-option');
  if (!opt) {
    langDropdown.querySelector('.dropdown-menu').classList.toggle('open');
    return;
  }
  lang = opt.dataset.value;
  store('lang', lang);
  translate();
  if (document.getElementById('screen-q').classList.contains('active')) renderQuestion();
  langDropdown.querySelector('.dropdown-menu').classList.remove('open');
});
document.addEventListener('click', e => {
  if (!e.target.closest('[data-dropdown="lang"]')) {
    const m = langDropdown.querySelector('.dropdown-menu');
    if (m) m.classList.remove('open');
  }
});

document.getElementById('theme-toggle').addEventListener('click', () => {
  mode = mode === 'dark' ? 'light' : 'dark';
  store('mode', mode);
  applyTheme();
});

applyTheme();
translate();
if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
